  description: "A NumPy/JAX library for Tucker tensor trains, a tensor network format that breaks the curse of dimensionality at moderate rank. Grew out of the [Tucker Tensor Train Taylor Series](publications/t4s.qmd) paper, but is a general-purpose library — cite the paper for the research contributions, the software separately if you're just using the tool."

